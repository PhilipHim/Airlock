[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airlock"
version = "0.1.0"
description = "Policy gate for collaborative Flower agents"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = [
    "flwr[agent]>=1.35.0,<2.0",
    "openai>=2.16.0,<3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "local"
display-name = "AIRLOCK"
fab-format-version = 1
flwr-version-target = "1.35.0"
fab-include = ["agent/**/*.py", "data/**/*.json", "LICENSE"]

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"

[tool.flwr.app.config.agent]
model = "flower-endeavor-v1.0"
input = "move"
max-tool-turns = 0
